# Isaac-0.5 robot policy with request batching: up to max_num_seqs OpenPI requests per engine wave run as one
# packed VLM prefill + one batched DiT plan (IsaacActionPipeline.supports_request_batch). Set ISAAC05_MAXB to match.
pipeline: isaac05_action
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16
stages:
  - stage_id: 0
    devices: "0,1,2,3"
    max_num_seqs: 16
    model_class_name: IsaacActionPipeline
    engine_args:
      parallel_config:
        tensor_parallel_size: 4
      request_batch_max_wait_ms: 5
    model_config:
      num_inference_steps: 10
      policy_server_config:
        image_resolution: [256, 256]
        n_external_cameras: 1
        needs_wrist_camera: true
        needs_stereo_camera: false
        needs_session_id: false
        action_space: joint_position
        action_horizon: 50
        action_dim: 7
