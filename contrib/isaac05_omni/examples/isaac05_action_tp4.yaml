# Isaac-0.5 robot policy (LIBERO policy state) on one trn2 device: single diffusion stage, TP=4 (LNC=2).
# Served through the OpenPI realtime API (/v1/realtime/robot/openpi); actions ride in multimodal_output["actions"].
pipeline: isaac05_action
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16
stages:
  - stage_id: 0
    devices: "0,1,2,3"
    max_num_seqs: 1
    model_class_name: IsaacActionPipeline
    engine_args:
      parallel_config:
        tensor_parallel_size: 4
    model_config:
      num_inference_steps: 10
      policy_server_config:
        image_resolution: [256, 256]
        n_external_cameras: 1
        needs_wrist_camera: true
        needs_stereo_camera: false
        needs_session_id: false
        action_space: joint_position
        action_horizon: 50
        action_dim: 7
